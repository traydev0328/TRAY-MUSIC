name: Deploy TRAY BLACK RAIN (GitHub Pages)

# tray-fps/ 폴더를 GitHub Pages 로 배포한다.
# 최초 1회: 저장소 Settings → Pages → Build and deployment → Source 를 "GitHub Actions" 로 선택.
on:
  push:
    branches: [ main ]
    paths: [ 'tray-fps/**', '.github/workflows/fps-pages.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tray-fps
      - id: deployment
        uses: actions/deploy-pages@v4
